<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Los Santos a Dos</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="hud.css">
  <link rel="stylesheet" href="welcome.css">
  <script defer src="../contratos.js"></script>
  <script defer src="../expansion.js"></script>
  <script defer src="../flota.js"></script>
  <script defer src="../campana.js"></script>
  <script defer src="../frecuencia.js"></script>
  <script defer src="../operaciones.js"></script>
  <script defer src="../turnos.js"></script>
  <script defer src="../atracos.js"></script>
  <script defer src="hud.js"></script>
  <script defer src="welcome.js"></script>
  <script defer src="panel.js"></script>
</head>
<body>
  <main id="app" hidden aria-label="Central de Los Santos a Dos">
    <header class="top">
      <div class="brand"><span aria-hidden="true">LS</span><strong>Los Santos a Dos</strong></div>
      <div class="account"><span id="completed"></span><strong id="cash"></strong><button id="close" aria-label="Cerrar panel">Esc <b aria-hidden="true">×</b></button></div>
    </header>
    <nav id="tabs" aria-label="Secciones">
      <button data-tab="hq" aria-pressed="true">Cuartel general</button>
      <button data-tab="operations" aria-pressed="false">Operaciones</button>
      <button data-tab="heists" aria-pressed="false">Atracos</button>
      <button data-tab="campaign" aria-pressed="false">Campañas</button>
      <button data-tab="contracts" aria-pressed="false">Mundo libre</button>
      <button data-tab="garage" aria-pressed="false">Garaje</button>
      <button data-tab="hangar" aria-pressed="false">Hangar</button>
      <button data-tab="shop" aria-pressed="false">Suministros</button>
      <button data-tab="world" aria-pressed="false">Exploración</button>
      <button data-tab="settings" class="utility-tab" aria-pressed="false">Ajustes del HUD</button>
      <button data-tab="help" class="utility-tab" aria-pressed="false">Ayuda</button>
    </nav>
    <div id="viewport">
      <section class="workspace-heading" aria-labelledby="section-title">
        <h1 id="section-title">Cuartel general</h1>
        <button id="resume" type="button" hidden>Ver misión activa</button>
      </section>
      <div id="bar"></div>
      <div id="overview"></div>
      <div id="objectives" hidden></div>
      <div id="stories" role="group" aria-label="Campañas disponibles" hidden></div>
      <div id="chapters" hidden></div>
      <div id="content"></div>
    </div>
    <footer><span id="status" role="status">Consultando la central…</span><span class="record" id="best"></span></footer>
  </main>
</body>
</html>
